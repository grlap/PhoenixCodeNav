# Prepare dependencies separately, from the repository root:
# pwsh -NoProfile -File ./scripts/prepare-test-prerequisites.ps1
# Then run one command below exactly as written, as a single shell call.
# Run projects sequentially: their builds share dependencies and output paths.
# Each entry builds and tests one net10.0 project and writes its own TRX.
# artifacts/ is already Git-ignored. Do not edit this file during a test run.
# Recognition requires a running TermAl host with declared-command support;
# recorded verification also depends on its support for this workspace's submodules.
# These project runs do not replace the complete check-in gate:
# pwsh -NoProfile -File ./scripts/gate-summary.ps1

[[test]]
command = 'dotnet test ./tests/CodeNav.Tests/CodeNav.Tests.csproj -c Release --framework net10.0 --no-restore --nologo --logger "trx;LogFileName=results.trx" --results-directory artifacts/termal-results/CodeNav.Tests'
cwd = "."
artifact = "artifacts/termal-results/CodeNav.Tests/results.trx"

