name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".gitattributes"
      - ".github/workflows/static.yml"
      - "tests/integration/roslyn-mcp-baseline.json"
      - "LICENSE"
      - "LICENSE.md"
      - "LICENSE.txt"
      - "COPYING"
      - "COPYING.md"
      - "TERMS.md"
      - "EULA.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5

      - name: Verify website
        run: node ./website/verify.mjs --auto

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
